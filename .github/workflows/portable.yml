name: Portable Windows

# PR/push  -> build + self-test + verifikasi zip (upload sebagai artifact)
# tag v*   -> build yang sama, lalu upload ke GitHub Release
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "launcher.py"
      - "portable_runtime.py"
      - "run.py"
      - "webapp.py"
      - "requirements.txt"
      - "templates/**"
      - "static/**"
      - "portable/**"
      - ".github/workflows/portable.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Versi untuk asset (kosongkan = pakai file VERSION)"
        required: false
        type: string
      dry_run:
        description: "Hanya build + tulis draft release notes, jangan sentuh GitHub Release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build paket portable x64
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            portable/requirements-build.txt

      # Regression test harus jalan SEBELUM build mahal. Testnya offline
      # (pakai fixture HTML), jadi tidak bergantung koneksi ke YouTube.
      - name: Unit test scan heatmap
        shell: pwsh
        run: |
          python tests/test_heatmap_scan.py
          if ($LASTEXITCODE -ne 0) { throw "Unit test heatmap gagal." }

      - name: Cache bin/ eksternal
        uses: actions/cache@v4
        with:
          path: bin
          key: portable-bin-${{ runner.os }}-${{ hashFiles('portable/fetch-deps.ps1') }}
          restore-keys: portable-bin-${{ runner.os }}-

      - name: Tentukan versi
        id: ver
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}".Trim()
          if (-not $v) { $v = (Get-Content VERSION -Raw).Trim() }
          if (-not $v) { throw "Versi tidak bisa ditentukan." }
          if ($env:GITHUB_REF -like "refs/tags/v*") { $v = $env:GITHUB_REF -replace "^refs/tags/v", "" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "is_tag=$($env:GITHUB_REF -like 'refs/tags/v*')" >> $env:GITHUB_OUTPUT
          Write-Host "versi paket: $v  (tag: $($env:GITHUB_REF))"

      - name: Install dependency build
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r portable/requirements-build.txt
          python -m PyInstaller --version

      - name: Tarik ffmpeg / ffprobe / yt-dlp
        shell: pwsh
        run: pwsh -NoProfile -File portable/fetch-deps.ps1

      - name: Build paket + self-test + verifikasi zip
        shell: pwsh
        run: pwsh -NoProfile -File portable/build-portable.ps1 -Version "${{ steps.ver.outputs.version }}" -SkipDeps

      - name: "Smoke test: server benar-benar hidup"
        shell: pwsh
        run: portable/smoke-portable.ps1 -StageDir "build-portable\stage\YoutubeHeatmapClipper_v${{ steps.ver.outputs.version }}_x64"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeHeatmapClipper_v${{ steps.ver.outputs.version }}_x64_portable
          path: |
            build-portable/YoutubeHeatmapClipper_v${{ steps.ver.outputs.version }}_x64_portable.zip
            build-portable/YoutubeHeatmapClipper_v${{ steps.ver.outputs.version }}_x64_portable.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish ke GitHub Release
        # PENTING: inputs.dry_run bertipe boolean, jadi HARUS dibandingkan
        # dengan boolean. `== 'true'` selalu false karena GitHub menyamakan
        # tipe: boolean -> 1, string 'true' -> NaN.
        if: steps.ver.outputs.is_tag == 'true' || inputs.dry_run == true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.ver.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          $assets = @(
            "build-portable/YoutubeHeatmapClipper_v${{ steps.ver.outputs.version }}_x64_portable.zip",
            "build-portable/YoutubeHeatmapClipper_v${{ steps.ver.outputs.version }}_x64_portable.zip.sha256"
          )
          foreach ($a in $assets) { if (-not (Test-Path $a)) { throw "Asset hilang: $a" } }

          # Body release yang informatif: ukuran, checksum, isi paket, gate build.
          $zip = $assets[0]
          $zipItem = Get-Item $zip
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $mib = [math]::Round($zipItem.Length / 1MB, 1)
          $notes = @(
            "## Paket Portable Windows x64",
            "",
            "Ekstrak zip, lalu **double-click ``YoutubeHeatmapClipper.exe``**. Tidak perlu install Python, FFmpeg, maupun yt-dlp - semuanya sudah di dalam paket.",
            "",
            "**Ukuran:** $mib MiB ($($zipItem.Length.ToString('N0')) byte)",
            "**SHA256:** ``$sha``",
            "",
            "Cek checksum sebelum dipakai:",
            "",
            '```bash',
            "sha256sum -c $(Split-Path -Leaf $zip).sha256",
            '```',
            "",
            "### Isi paket",
            "",
            "| Komponen | Keterangan |",
            "|---|---|",
            "| Python runtime | 3.11, dibundel di ``_internal/`` |",
            "| Flask | server web lokal |",
            "| ffmpeg / ffprobe | build win64 dari paket, bukan dari PATH sistem |",
            "| yt-dlp | exe mandiri, bisa ditukar manual |",
            "| faster-whisper | subtitle otomatis (model diunduh sekali saat dipakai) |",
            "| Font | 92 file, Roboto + Roboto Mono |",
            "",
            "### Cara pakai",
            "",
            "1. Ekstrak **seluruh folder** (``_internal/`` wajib ikut).",
            "2. Jalankan ``YoutubeHeatmapClipper.exe``.",
            "3. Browser terbuka otomatis ke ``http://127.0.0.1:5000``. Kalau port 5000 bentrok, aplikasi cari port kosong berikutnya dan mencetak URL-nya di jendela konsol.",
            "4. Hasil clip tersimpan di ``clips\`` sebelah ``exe``.",
            "",
            "### Opsi exe",
            "",
            "- ``--port 5050`` - paksa port tertentu",
            "- ``--no-browser`` - jangan buka browser otomatis",
            "- ``--url <link>`` / ``--check`` - mode CLI",
            "- ``--self-test`` - cek kelengkapan paket lalu keluar",
            "- ``--version`` - cetak versi",
            "",
            "Diekstrak ke folder read-only (mis. ``C:\Program Files``) membuat output otomatis dialihkan ke ``%LOCALAPPDATA%\YoutubeHeatmapClipper\``.",
            "",
            "### Gate build",
            "",
            "Zip ini hanya terbit kalau tiga gate hijau, bukan cuma build sukses:",
            "",
            "1. ``YoutubeHeatmapClipper.exe --self-test --require-whisper`` - semua cek lulus",
            "2. Smoke test HTTP ke server yang dijalankan dari paket - ``/``, ``/static/app.js``, font, dan route 404",
            "3. ``verify_portable.py`` membaca nama file di dalam zip dan demanding 12 file wajib"
          ) -join "`n"
          [System.IO.File]::WriteAllText("$env:RUNNER_TEMP\notes.md", $notes, (New-Object System.Text.UTF8Encoding $false))

          if ($env:DRY_RUN -eq "true") {
            Write-Host "==> DRY RUN: GitHub Release tidak disentuh. Isi draft notes:"
            Get-Content "$env:RUNNER_TEMP\notes.md"
            exit 0
          }

          # Pola idempotent: hapus release lama, buat ulang, lalu upload.
          gh release delete $env:TAG --yes --cleanup-tag 2>$null
          gh release create $env:TAG @assets `
            --title "YouTube Heatmap Clipper v${{ steps.ver.outputs.version }} (portable Windows x64)" `
            --notes-file "$env:RUNNER_TEMP\notes.md" `
            --generate-notes
          gh release view $env:TAG --json assets --jq ".assets[].name"
